name: Frontend CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 前端检查与构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: 获取代码
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # 固定 v6，避免标签漂移
        with:
          persist-credentials: false

      - name: 配置 Node.js 与依赖缓存
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # 固定 v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: 按锁文件安装依赖
        run: npm ci --no-audit --no-fund

      - name: 检查 JavaScript 与 Vue
        run: npm run lint

      - name: 检查前端格式
        run: npm run format:check

      - name: 运行前端回归测试
        run: npm test

      - name: 构建生产版本
        run: npm run build
